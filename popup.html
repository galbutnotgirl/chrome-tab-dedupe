<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <input id="find" class="find" type="text" placeholder="Search all tabs…"
      autocomplete="off" spellcheck="false" autofocus />

    <div class="views">
      <button data-view="duplicates" class="seg">Duplicates</button>
      <button data-view="clutter" class="seg">Clutter</button>
      <button data-view="finished" class="seg">Finished</button>
      <button data-view="related" class="seg">Related</button>
    </div>

    <div class="scope" id="scopeRow">
      <button data-scope="window" class="seg">This window</button>
      <button data-scope="all" class="seg">All windows</button>
    </div>

    <p id="summary" class="summary">Checking…</p>
    <ul id="list" class="list"></ul>
    <div id="related" class="groups" hidden></div>
    <ul id="results" class="list" hidden></ul>

    <button id="sweep" class="primary" disabled>Close duplicates</button>

    <div class="row">
      <label class="toggle" id="autoRow">
        <input type="checkbox" id="autoDedupe" />
        Auto-close new duplicate tabs
      </label>
      <div class="hintRow">
        <p id="hint" class="hint"></p>
        <span class="links">
          <button id="selectAll" class="link" hidden>Select all</button>
          <button id="clearAll" class="link" hidden>Clear</button>
        </span>
      </div>
    </div>

    <div class="footer">
      <button id="arm" class="link">Let the next tab through</button>
      <button id="merge" class="link" hidden>Merge windows</button>
      <button id="undo" class="link" hidden>Undo</button>
      <button id="options" class="link">Settings</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
